<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#A2533A","options":["#A2533A","#467054","#3B6D8F","#6B4C8C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  rgb(hex) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
    if (!/^[0-9a-fA-F]{6}$/.test(h)) { h = 'A2533A'; }
    return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
  }
  rgba(hex, a) {
    var c = this.rgb(hex);
    return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')';
  }
  mix(hex, to, t) {
    var c = this.rgb(hex);
    var out = '#';
    for (var i = 0; i < 3; i++) { out += ('0' + Math.round(c[i] + (to - c[i]) * t).toString(16)).slice(-2); }
    return out;
  }
  renderVals() {
    var accent = this.props.accent ?? '#A2533A';
    return {
      accent: accent,
      accentEdge: this.mix(accent, 0, 0.22),
      discTint: this.mix(accent, 255, 0.78),
      discShadow: this.rgba(accent, 0.22),
      ring: this.rgba(accent, 0.45),
      sky1: this.rgba(accent, 0.36),
      sky1Soft: this.rgba(accent, 0.12)
    };
  }
}
