class Component extends DCLogic {
  mix(hex, to, t) {
    var h = String(hex || '').replace('#', '');
    if (h.length === 3) { h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2]; }
    if (!/^[0-9a-fA-F]{6}$/.test(h)) { return hex; }
    var out = '#';
    for (var i = 0; i < 3; i++) {
      var c = parseInt(h.substr(i * 2, 2), 16);
      var v = Math.round(c + (to - c) * t);
      out += ('0' + v.toString(16)).slice(-2);
    }
    return out;
  }
  renderVals() {
    var accent = this.props.accent ?? '#A2533A';
    return {
      accent: accent,
      accentEdge: this.mix(accent, 0, 0.22),
      accentTint: this.mix(accent, 255, 0.8),
      accentTintEdge: this.mix(accent, 255, 0.6)
    };

}
