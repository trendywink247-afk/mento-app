# SOPS creation rules — which age keys can open which encrypted file.
# Key custody and the one-time setup: docs/DEPLOYMENT_VPS.md → "Secrets (SOPS + age)".
#
# Every production secret is encrypted to TWO recipients:
#   1. the founder's personal age key (kept offline: password manager + paper backup),
#      so a lost server never loses the secrets;
#   2. the production server's own age key (~/.config/sops/age/keys.txt for mento-ops
#      on the box, never copied anywhere), so the box can decrypt at deploy time.
#
# The two placeholders below are NOT keys. sops refuses to encrypt until they are
# replaced with the real public keys (`age-keygen -y <keyfile>` prints one) — that
# failure is deliberate: nothing gets encrypted to a key nobody holds.
#
# The character class in path_regex ([\/] not /) matters on Windows: sops matches
# --filename-override against its own path representation, which uses backslashes
# there — a plain forward-slash regex silently matches nothing and sops refuses
# with "no matching creation rules found" (found generating this file, session 47).
creation_rules:
  - path_regex: deploy[\\/]secrets[\\/]prod\.env\.sops\.yaml$
    age: >-
      age19wwdklnyc0r37czhr6e8fg73ww43xenx8ge96gsyezhk8lq7zv6qedacrv,
      age1qylx0yw47x9vsvlkrfqfpufvnrqcwe9sj38zekm0uxs4pajcpgeqjpm33l

  # QA (129.121.171.140): dotenv files in deploy/staging/secrets, named *.enc.env.
  # Exactly two recipients: the QA server's key (/etc/mento/age/qa.key, root only on
  # the box) and the QA recovery key (held in the team password manager). No others.
  - path_regex: deploy[\\/]staging[\\/]secrets[\\/][^\\/]+\.enc\.env$
    age: >-
      age1ldqs8347spf5jmqefrmwy5xlj7hlsm773qdj9d6n29v4dxzehd4sk00evk,
      age1ex54pfy45hw007za70xzzfn0nfh433fn0qvvc9cqmtwv2dp5m44qu0pk5k
