# Local dev infrastructure for the Mento API.
# Brings up Postgres (matching the default DATABASE_URL) + Redis.
# Usage:  docker compose up -d   /   docker compose down
services:
  postgres:
    image: postgres:16-alpine
    container_name: mento-postgres
    environment:
      POSTGRES_USER: mento
      POSTGRES_PASSWORD: mento
      POSTGRES_DB: mento
    ports:
      - "5432:5432"
    volumes:
      - mento_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mento -d mento"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mento-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mento_pgdata:
