# T6.1 — a member and a mentor in the same conversation, message flowing both
# directions. Maestro only drives ONE native app instance, so the mentor side
# is not a second phone here — it's mentor-bot.mjs, a separate process that
# answers through the same API/Stream path the real mentor console uses.
# Start it BEFORE this flow, watching for the member's message:
#
#   node e2e/maestro/mentor-bot.mjs --token <listener-token> \
#     --api http://localhost:8000/api/v1 --timeout 60
#
# Full setup in README.md — seeding a listener, minting its token, starting
# the bot, then running this flow. If the bot never sees a message (this flow
# never got as far as sending one) it exits 1 after --timeout; check both
# exit codes, not just this flow's.
appId: com.mento.app
---
- launchApp:
    clearState: true
# Cold launch's first paint (aurora/Skia canvas mount, CLAUDE.md) is the slowest in
# the whole flow, and dramatically more so under this CI emulator's software-rendered
# SwiftShader graphics than on real hardware — session 48, run 6: 22+s between launch
# and a bare tapOn timing out on the very first real emulator run these flows ever got.
# Every later screen transition already gets this treatment; this was the one gap.
#
# T6.2 (2026-10-01): 60s -> 90s -> 150s, same reasoning as
# onboarding-first-message.yaml — 90s still failed right at the edge (~91s).
- extendedWaitUntil:
    visible:
      id: "start"
    timeout: 150000
- tapOn:
    id: "start"
- tapOn:
    id: "role-talk"
- tapOn:
    id: "continue"
- tapOn:
    id: "skip"
- tapOn:
    id: "animal-panda"
- tapOn:
    id: "colour-terracotta"
- tapOn:
    id: "continue"
- tapOn:
    id: "enter"
- extendedWaitUntil:
    visible:
      id: "composer-input"
    timeout: 20000

- tapOn:
    id: "composer-input"
- inputText: "hi, thanks for being here"
- tapOn:
    id: "composer-send"

# mentor-bot.mjs is watching for exactly this message and replies over Stream. Text
# must match its default --reply exactly (README documents overriding both together).
#
# History, so nobody tunes this again: this wait was raised 45s -> 90s -> 150s over runs
# 16-20 and never helped, because the bot was replying into FLOW 1's conversation, not
# this one (it took the first active conversation, and flow 1's was still open; the
# matcher also sent this member to a different listener than the bot's). Both fixed —
# the bot now ignores conversations that predate it and CI pins matching to its one
# listener. With those, the round trip is a few seconds; 90s is generous headroom.
#
# T6.2 (2026-10-01): raised again, 90s -> 120s — not because the round trip got
# slower (it's still a few seconds once the bot is actually alive to see the
# message), but because mentor-bot.mjs's OWN lifetime budget was proven too short
# under SDK 55 + this job's now much longer prebuild (see maestro.yml's --timeout
# 480 comment) — the bot was timing itself out before flow 2 even sent anything.
# This wait only matters once that's fixed; a little extra margin here is cheap.
- extendedWaitUntil:
    visible:
      text: "I'm here — tell me more when you're ready."
    timeout: 120000
