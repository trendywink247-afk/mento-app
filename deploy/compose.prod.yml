# Prod overrides for the Balanced stack. Run only through deploy/deploy.sh with
# MENTO_STACK=balanced, which exports MENTO_ENV_FILE (the decrypted env on tmpfs —
# deploy/decrypt-env.sh — or services/api/.env before SOPS is adopted) and
# POSTGRES_PASSWORD read from it.
# Allowed differences from local: env values, published ports, memory/log limits,
# hostnames, host-side paths, and (T1.2) command/ulimits — the tuning flags below
# size Postgres/Valkey/the API to the 4 GB prod box and have no local equivalent;
# they are the same image and behaviour either side, only sized differently
# (deploy/test-parity.sh's ALLOWED set says so explicitly).
x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://mento:${POSTGRES_PASSWORD:?exported by deploy.sh}@postgres:5432/mento
  REDIS_URL: redis://valkey:6379/0

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-api-common: &api-common
  <<: *logging
  ulimits:
    nofile: 65535

services:
  postgres:
    <<: *logging
    environment:
      POSTGRES_USER: mento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?exported by deploy.sh}
      POSTGRES_DB: mento
    # Sized for the 4 GB box (docs/DEPLOYMENT_VPS.md); mem_limit leaves headroom for
    # the API, Valkey and Caddy alongside it.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1536MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - random_page_cost=1.1
      - -c
      - wal_compression=on
      - -c
      - checkpoint_timeout=15min
      - -c
      - max_wal_size=1GB
    mem_limit: 1024m

  valkey:
    <<: *logging
    # No persistence (Valkey here is cache + rate-limit state, not a store of
    # record): --save "" --appendonly no. Bounded and self-evicting under pressure.
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "volatile-lru"]

  api_blue:
    <<: *api-common
    env_file: ["${MENTO_ENV_FILE:?exported by deploy.sh}"]
    environment: *api-env

  api_green:
    <<: *api-common
    env_file: ["${MENTO_ENV_FILE:?exported by deploy.sh}"]
    environment: *api-env

  migrate:
    <<: *api-common
    env_file: ["${MENTO_ENV_FILE:?exported by deploy.sh}"]
    environment: *api-env

  worker:
    <<: *api-common
    env_file: ["${MENTO_ENV_FILE:?exported by deploy.sh}"]
    environment: *api-env
    mem_limit: 256m

  caddy:
    <<: *logging
    # Hostnames come only from deploy/domains.env.
    env_file: ["./domains.env"]
    environment:
      CADDY_TLS: auto
    volumes:
      # deploy/deploy-web.sh swaps /opt/mento-console/current atomically; mounting
      # the parent lets Caddy see the swap without a restart.
      - /opt/mento-console:/srv/web:ro
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3

  # T1.7: error tracker, MIT-licensed, self-hosted. Its own database inside the
  # existing Postgres (glitchtip-init-db creates it once — Postgres only
  # auto-creates the DB named by POSTGRES_DB) and its own Valkey db index (1 —
  # the API uses 0). Not on Caddy: staff reach it over an SSH tunnel
  # (docs/DEPLOYMENT_VPS.md), not a public host — deploy/domains.env stays the
  # only place a public hostname is written. SERVER_ROLE=all_in_one runs web +
  # worker + migrations in one container; right-sized for a 4 GB box.
  glitchtip-init-db:
    image: postgres:16-alpine
    profiles: ["tools"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?exported by deploy.sh}
    entrypoint: ["sh", "-c"]
    command:
      - >
        psql -h postgres -U mento -d mento -tc "SELECT 1 FROM pg_database WHERE datname = 'glitchtip'"
        | grep -q 1 || psql -h postgres -U mento -d mento -c "CREATE DATABASE glitchtip"

  glitchtip:
    <<: *logging
    image: glitchtip/glitchtip:6
    container_name: mento-glitchtip
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://mento:${POSTGRES_PASSWORD:?exported by deploy.sh}@postgres:5432/glitchtip
      VALKEY_URL: redis://valkey:6379/1
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?exported by deploy.sh — openssl rand -hex 32}
      EMAIL_URL: consolemail://
      GLITCHTIP_DOMAIN: http://localhost:8000 # SSH-tunnel only; not a real public host
      DEFAULT_FROM_EMAIL: ops@mento.chat
      SERVER_ROLE: all_in_one
      ENABLE_ADMIN: "False"
      ENABLE_USER_REGISTRATION: "False" # closed from the start — see docs/DEPLOYMENT_VPS.md
      ALLOWED_HOSTS: localhost,127.0.0.1 # only ever reached over the SSH tunnel
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/_health/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s # migrations run on this container's own first boot
    mem_limit: 512m
    ports:
      - "127.0.0.1:8010:8000" # ssh -L 8010:localhost:8010 — see docs/DEPLOYMENT_VPS.md
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  glitchtip_uploads:
