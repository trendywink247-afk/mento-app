# PROPOSAL, NOT APPLIED ANYWHERE. For root to review and apply on a host it owns.
# Query statistics and slow-query logging for Postgres 16. Nothing here changes data;
# pg_stat_statements needs one Postgres restart (shared_preload_libraries).
#
# How (compose stack): add each setting below to the postgres `command:` list as
# `-c name=value`, restart postgres once, then per database:
#     CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
# Look at the worst queries with:
#     SELECT calls, round(mean_exec_time::numeric,1) AS mean_ms, round(total_exec_time::numeric) AS total_ms, left(query,100)
#     FROM pg_stat_statements ORDER BY total_exec_time DESC LIMIT 20;
#
# The statement log can contain literal values. Chat bodies are encrypted before they reach
# SQL (AES-256-GCM), but other columns are not: keep the log on the host, never ship it to a
# third party, and keep log_parameter_max_length = 0 so bound parameters are not written.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = 'top'
pg_stat_statements.max = 5000
log_min_duration_statement = 250
log_lock_waits = on
log_temp_files = 0
log_parameter_max_length = 0
