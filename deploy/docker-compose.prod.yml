# Mento — production stack for a self-managed VPS (Hostinger or any Ubuntu box).
# Unlike services/api/docker-compose.yml (local dev infra only), this file also
# builds and runs the API itself. Postgres/Redis here are self-managed containers
# (no DO managed PITR in this setup) — see deploy/backup-postgres.sh for backups.
#
# Nginx is NOT containerized here — install it on the host (see docs/DEPLOYMENT_VPS.md)
# so certbot's standard renewal path just works. This compose file only binds the
# API to 127.0.0.1, so it's unreachable except through the host Nginx reverse proxy.
#
# Usage: ./deploy/deploy.sh (migrations first, then the api container). A bare
#   `docker compose -f deploy/docker-compose.prod.yml up -d --build` no longer
#   migrates — the API container stopped running migrations on boot (WS1 T1.9).

# mem_limit values below assume the 1-2 GB RAM VPS this was first deployed to
# (docs/DEPLOYMENT_VPS.md) plus the 2 GB swap file set up there. Raise/remove
# these if you move to a bigger box.
services:
  postgres:
    image: postgres:16-alpine
    container_name: mento-postgres-prod
    restart: always
    mem_limit: 256m
    env_file:
      - ${MENTO_ENV_FILE:-../services/api/.env}
    environment:
      POSTGRES_USER: mento
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in services/api/.env}
      POSTGRES_DB: mento
    volumes:
      - mento_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mento -d mento"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Not published to the host at all — only the api container reaches it,
    # over the compose-internal network.

  redis:
    image: redis:7-alpine
    container_name: mento-redis-prod
    restart: always
    mem_limit: 128m
    volumes:
      - mento_redisdata_prod:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    # Tagged per commit by deploy/deploy.sh, so a failed deploy can put the previous
    # image back. It no longer migrates on boot: deploy.sh runs migrations first.
    image: mento-api:${API_TAG:-latest}
    container_name: mento-api-prod
    restart: always
    mem_limit: 384m
    env_file:
      - ${MENTO_ENV_FILE:-../services/api/.env}
    environment:
      DATABASE_URL: postgresql+psycopg://mento:${POSTGRES_PASSWORD}@postgres:5432/mento
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"   # host Nginx proxies to this; never expose publicly here

  # The job queue's worker (WS4, app/jobs/worker.py): same image as api, no port.
  # deploy.sh recreates it on the new image once api is healthy. Without it, queued
  # pushes and the periodic sweeps wait in Postgres (admin Health shows the backlog).
  worker:
    image: mento-api:${API_TAG:-latest}
    container_name: mento-worker-prod
    command: ["python", "-m", "app.jobs.worker"]
    restart: always
    mem_limit: 256m
    env_file:
      - ${MENTO_ENV_FILE:-../services/api/.env}
    environment:
      DATABASE_URL: postgresql+psycopg://mento:${POSTGRES_PASSWORD}@postgres:5432/mento
      REDIS_URL: redis://redis:6379/0
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  mento_pgdata_prod:
  mento_redisdata_prod:
