# Nginx static host for the Mento web build — member app + listener console + admin dashboard (one SPA).
# Copy to /etc/nginx/sites-available/mento-console.conf (already TLS-provisioned
# via certbot — this version has the cert paths hardcoded, unlike
# mento-api.conf.template, since certbot's --nginx plugin was run once already):
#   sudo cp deploy/nginx/mento-console.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/mento-console.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# This is the SAME Expo bundle as the member app (single "web.output: single"
# build), so this domain serves the whole app: "/" is the landing screen and the
# journey into chat, alongside the web-only consoles (/admin, /listener) and the
# public listener-recruitment page (/apply).
#
# History: session 28 allow-listed ONLY /admin, /listener, /apply and 404'd the
# rest, because the member flow was mobile-only by design. The founder reversed
# that on 2026-09-19 (PROGRESS.md session 34) — the member app is now meant to
# be reachable here. Everything that protects a member is server-side (age gate,
# crisis scan on the Stream webhook, rate limits), so it holds on web too.
server {
    listen 443 ssl;
    server_name console.agentin.chat;

    root /opt/mento-console/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/console.agentin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.agentin.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Static assets: a missing file is a real 404, never the SPA shell (a JS/CSS
    # request answered with index.html fails confusingly in the browser).
    location /_expo/ {
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }

    # Every app route (/, /onboarding, /chat/…, /admin, /listener, /apply, …) boots
    # the SPA; expo-router resolves the path client-side, unknown ones land on the
    # branded +not-found screen.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name console.agentin.chat;
    return 301 https://$host$request_uri;
}
