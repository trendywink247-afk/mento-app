# Nginx static host for the Mento admin dashboard + listener console (SPA).
# Copy to /etc/nginx/sites-available/mento-console.conf (already TLS-provisioned
# via certbot — this version has the cert paths hardcoded, unlike
# mento-api.conf.template, since certbot's --nginx plugin was run once already):
#   sudo cp deploy/nginx/mento-console.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/mento-console.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# IMPORTANT: this is the SAME Expo bundle as the member app (single
# "web.output: single" build) — every route (/onboarding, /chat, /journal, ...)
# is technically present in the JS. This config deliberately allow-lists ONLY
# /admin, /listener, and /apply (the two web-only consoles + the public
# listener-recruitment landing page), redirects the bare "/" to /apply, and
# 404s everything else, so the
# member-facing anonymous-chat flow (mobile-only by design; web is
# dev/test-only) is never reachable from this domain. Found live in session
# 28 — console.agentin.chat/onboarding was reachable and actually ran real
# matching against prod before this lockdown existed.
server {
    listen 443 ssl;
    server_name console.agentin.chat;

    root /opt/mento-console/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/console.agentin.chat/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/console.agentin.chat/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # try_files' final fallback does an internal redirect that re-enters location
    # matching — this exact-match rule is what lets /index.html actually resolve
    # instead of falling into the catch-all 404 below (exact match always wins
    # over a prefix match in Nginx, regardless of file order).
    location = /index.html {
    }

    location /admin {
        try_files $uri $uri/ /index.html;
    }

    location /listener {
        try_files $uri $uri/ /index.html;
    }

    location /apply {
        try_files $uri $uri/ /index.html;
    }

    # Static assets referenced by index.html regardless of which route booted it.
    location /_expo/ {
        try_files $uri =404;
    }
    location /assets/ {
        try_files $uri =404;
    }

    # The bare domain is what people type — send it to the one public page rather
    # than dead-ending on a 404. Exact match, so it never serves the bundle at "/"
    # (the member app's landing screen) and the lockdown below is untouched.
    location = / {
        return 302 /apply;
    }

    # Everything else is deliberately NOT served here.
    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name console.agentin.chat;
    return 301 https://$host$request_uri;
}
