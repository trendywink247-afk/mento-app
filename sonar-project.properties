# SonarQube project for the whole monorepo. Scan with ops/sonar-scan.sh (docs/SONARQUBE.md).
sonar.projectKey=mento
sonar.projectName=Mento
sonar.sourceEncoding=UTF-8

sonar.sources=apps/mobile/app,apps/mobile/components,apps/mobile/lib,apps/mobile/theme,services/api/app,services/recovery_receiver
sonar.tests=apps/mobile/e2e,services/api/tests
sonar.test.inclusions=apps/mobile/e2e/**,services/api/tests/**,services/recovery_receiver/tests/**

sonar.exclusions=**/node_modules/**,**/dist*/**,**/.expo/**,**/migrations/**,**/archive/**,**/Mockups/**,**/assets/**,apps/mobile/android/**,apps/mobile/ios/**,**/.venv/**,**/__pycache__/**,**/.tmp-*/**,services/recovery_receiver/tests/**

# Python
sonar.python.version=3.12

# TypeScript / JavaScript
sonar.typescript.tsconfigPaths=apps/mobile/tsconfig.json

# Coverage report paths and the scanner work directory are passed by ops/sonar-scan.sh as
# absolute paths outside the checkout, so a scan never leaves untracked files in the repo.

# Mobile coverage is not reported yet: the node unit tests load lib/ through vm-transpiled copies
# that Node's coverage cannot map back to the .ts files. Until they do, the mobile tree is left out
# of the coverage figure so it does not read as 0%. Issues, smells and duplication are still scanned.
sonar.coverage.exclusions=apps/mobile/**
