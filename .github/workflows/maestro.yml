name: Maestro (native e2e)

# The safety net for the Expo 52->57 upgrade (T6.2's own dependency rule: these
# flows must exist and pass BEFORE that upgrade starts, and after every one of
# its five steps). Runs against SDK 52 today — do not bump the emulator image
# here as part of an unrelated change; T6.2 does that deliberately, one step
# at a time, and re-runs this workflow after each one.
#
# Builds a debug APK (expo prebuild + gradlew assembleDebug, the same path
# docs/ANDROID_BUILD.md documents for local builds — nothing new invented
# here), brings up the same Postgres/Redis api-ci.yml uses, seeds listeners,
# and runs the three flows against a real emulator via
# reactivecircus/android-emulator-runner.
on:
  push:
    branches: [main, master]
    paths:
      - "apps/mobile/**"
      - "services/api/**"
      - ".github/workflows/maestro.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "services/api/**"
      - ".github/workflows/maestro.yml"
  workflow_dispatch: {}

jobs:
  check-secrets:
    # A job-level `if:` can't read `secrets` directly (actionlint: "context secrets is
    # not allowed here") — only `needs`/`vars`/`inputs`/`github`. Publish it as an
    # output from a step instead, where `secrets` IS readable, and gate `maestro` on
    # that output.
    runs-on: ubuntu-latest
    outputs:
      has-stream: ${{ steps.check.outputs.has-stream }}
    steps:
      - id: check
        run: |
          if [ -n "$STREAM_API_KEY" ] && [ -n "$STREAM_API_SECRET" ]; then
            echo "has-stream=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-stream=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}

  maestro:
    needs: check-secrets
    # Skips visibly (shown as "skipped", not "failed") when the repo has no Stream
    # project wired up yet — onboarding-first-message.yaml and two-party-chat.yaml
    # both need a real Stream project to match and chat against, and crisis-card.yaml
    # would silently pass its send-still-works assertion without ever proving the
    # crisis card, which is worse than not running at all. Also the natural behavior
    # for a pull_request from a fork, which never receives repo secrets.
    if: needs.check-secrets.outputs.has-stream == 'true'
    # KVM-accelerated emulators need a real (not container) Linux runner.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql+psycopg://mento:mento@localhost:5432/mento
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-secret-at-least-32-bytes-long-000000
      ENV: dev
      STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
      STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
      EXPO_PUBLIC_STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
      EXPO_PUBLIC_API_URL: http://10.0.2.2:8000/api/v1 # the emulator's host-loopback address
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships ~20GB of preinstalled toolchains this job never touches
      # (.NET, Haskell, extra Docker images...). The build alone got past that once
      # x86_64-only was fixed (session 48), but the emulator-runner's own SDK +
      # system-image download then hit the SAME "No space left on device" on top of
      # it — the two together exceed the runner's real free space. android: false is
      # deliberate: it must NOT touch the Android SDK the next steps install.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          tool-cache: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Start Postgres + Redis
        working-directory: services/api
        run: docker compose up -d --wait

      - name: Install API dependencies
        working-directory: services/api
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Migrate + seed listeners
        working-directory: services/api
        run: |
          python -m alembic upgrade head
          python -m scripts.seed_listeners

      - name: Start the API (background)
        working-directory: services/api
        run: |
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health && exit 0; echo "waiting ($i/30)..."; sleep 1; done
          echo "::error::API never became healthy" && cat api.log && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: npm ci

      - name: Prebuild + assemble debug APK
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform android --no-install
          # x86_64 only: the emulator below never runs the other three ABIs, and
          # building all four exhausted ubuntu-latest's disk mid-build (session 48 —
          # the same fix a local Windows build needed for the same reason). Also cuts
          # this step's native-module compile time roughly 4x, which matters against
          # the job's 45-minute timeout.
          cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Mint a listener console token for mentor-bot.mjs
        working-directory: services/api
        run: |
          NAME=$(python -c "
          from app.db import SessionLocal
          from app.models.listener import ListenerProfile
          db = SessionLocal()
          print(db.query(ListenerProfile).first().persona_name)
          db.close()")
          LINK=$(python -m scripts.issue_listener_token --name "$NAME" | grep 'Console link')
          echo "LISTENER_TOKEN=${LINK##*token=}" >> "$GITHUB_ENV"

      # Third real failure (session 48): without this, /dev/kvm exists but this runner
      # user can't open it, so the emulator falls back to pure-software CPU emulation
      # (TCG) — its own CPU thread hung and QEMU crashed ~2 minutes into boot. This is
      # reactivecircus/android-emulator-runner's own documented required step for
      # GitHub-hosted Linux runners (its README's every example includes it) — it was
      # simply missing here, not a config choice.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the three flows on a real emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33 # SDK 52's target — do not bump here; T6.2 owns emulator-version changes
          arch: x86_64
          profile: pixel_6
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk

            maestro test apps/mobile/e2e/maestro/onboarding-first-message.yaml

            ( node apps/mobile/e2e/maestro/mentor-bot.mjs \
                --token "$LISTENER_TOKEN" --api http://localhost:8000/api/v1 --timeout 60 \
                > mentor-bot.log 2>&1 &
              echo $! > mentor-bot.pid )
            maestro test apps/mobile/e2e/maestro/two-party-chat.yaml
            wait "$(cat mentor-bot.pid)" || { echo "::error::mentor-bot.mjs failed"; cat mentor-bot.log; exit 1; }

            maestro test apps/mobile/e2e/maestro/crisis-card.yaml

      - name: API log (always, for debugging)
        if: always()
        working-directory: services/api
        run: cat api.log || true

      - name: Tear down
        if: always()
        working-directory: services/api
        run: docker compose down -v
