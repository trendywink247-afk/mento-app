name: Isolated Rollback Rehearsal
on:
  workflow_dispatch:
    inputs:
      stack:
        description: Disposable stack to exercise
        required: true
        default: legacy
        type: choice
        options: [legacy, balanced, all]
permissions:
  contents: read
concurrency:
  group: mento-rollback-rehearsal
  cancel-in-progress: false
jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STACK: ${{ inputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Configure disposable repository identity
        run: |
          git config --global user.name 'Mento rollback rehearsal'
          git config --global user.email 'rollback-test@mento.invalid'
      - name: Exercise real deployment and recovery on an empty runner
        shell: bash
        run: |
          set -o pipefail
          bash deploy/test-deploy.sh "$STACK" 2>&1 | tee "$RUNNER_TEMP/rollback-rehearsal.log"
      - name: Preserve rehearsal transcript
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rollback-rehearsal
          path: ${{ runner.temp }}/rollback-rehearsal.log
          retention-days: 14
          if-no-files-found: warn
