name: API CI

# Brings up the same Postgres the dev stack uses (services/api/docker-compose.yml),
# applies Alembic migrations, then runs the test suite — including the matching
# concurrency tests, which require real Postgres row-locking.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: services/api

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.classify.outputs.api }}
      full: ${{ steps.classify.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        working-directory: .
        run: python3 scripts/ci/change_policy.py
  api-lint:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: python -m ruff check .

      - name: black --check
        run: python -m black --check .

  api-test:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      # Matches the docker-compose Postgres published on localhost:5432.
      DATABASE_URL: postgresql+psycopg://mento:mento@localhost:5432/mento
      JWT_SECRET: ci-secret-at-least-32-bytes-long-000000
      ENV: dev
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/api/requirements-dev.txt

      - name: Start Postgres + Redis (docker compose)
        run: docker compose up -d --wait # waits for the healthchecks to pass

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Verify schema matches models
        run: python -m alembic check # fails if a model change has no migration

      - name: Run tests
        run: python -m pytest

      - name: Tear down
        if: always()
        run: docker compose down -v
  lint:
    if: always()
    needs: [changes, api-lint]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected lint result
        working-directory: .
        env:
          CLASSIFIED: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.api }}
          RESULT: ${{ needs.api-lint.result }}
        run: |
          python3 -c 'import os; assert os.environ["CLASSIFIED"] == "success"; selected=os.environ["SELECTED"]; assert selected in ("true","false"); assert os.environ["RESULT"] == ("success" if selected == "true" else "skipped")'
  test:
    if: always()
    needs: [changes, api-test]
    runs-on: ubuntu-latest
    steps:
      - name: Require the selected database test result
        working-directory: .
        env:
          CLASSIFIED: ${{ needs.changes.result }}
          SELECTED: ${{ needs.changes.outputs.api }}
          RESULT: ${{ needs.api-test.result }}
        run: |
          python3 -c 'import os; assert os.environ["CLASSIFIED"] == "success"; selected=os.environ["SELECTED"]; assert selected in ("true","false"); assert os.environ["RESULT"] == ("success" if selected == "true" else "skipped")'
  full-suite:
    if: always() && needs.changes.outputs.full == 'true'
    needs: [changes, api-lint, api-test, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Record complete API acceptance for release evidence
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os; assert all(v["result"] == "success" for v in json.loads(os.environ["RESULTS"]).values())'
