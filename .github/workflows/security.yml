name: Security scans

# Non-blocking at first (continue-on-error): findings land in the job log and the
# SARIF/JSON artifacts so the first weeks show the noise before anything can fail a PR.
# Triage and how to promote a scan to blocking: docs/SECURITY_AUDIT.md.
# Scanner versions are pinned; downloaded binaries are checked against a sha256 kept here.
on:
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
  TRIVY_VERSION: "0.76.2"
  TRIVY_SHA256: "bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf"
  OSV_VERSION: "2.7.1"
  OSV_SHA256: "fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8"

jobs:
  python:
    name: bandit + pip-audit + semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install bandit==1.9.4 pip-audit==2.10.1 semgrep==1.185.0
      - name: bandit
        continue-on-error: true
        run: bandit --ini .bandit -r services/api/app services/recovery_receiver -x "*/tests/*" -f txt
      - name: pip-audit (api)
        continue-on-error: true
        run: pip-audit -r services/api/requirements.txt --progress-spinner off
      - name: pip-audit (recovery receiver)
        continue-on-error: true
        run: pip-audit -r services/recovery_receiver/requirements.txt --progress-spinner off
      - name: semgrep
        continue-on-error: true
        env:
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: >
          semgrep scan --metrics=off --config p/python --config p/owasp-top-ten --config p/typescript
          services/api/app services/recovery_receiver apps/mobile/app apps/mobile/lib apps/mobile/components

  mobile-deps:
    name: npm audit + osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: npm audit (production dependencies)
        continue-on-error: true
        working-directory: apps/mobile
        run: npm audit --omit=dev --package-lock-only
      - name: osv-scanner
        continue-on-error: true
        run: |
          curl -fsSL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source --lockfile apps/mobile/package-lock.json

  secrets-and-config:
    name: gitleaks + trivy config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks walks the full history
      - name: gitleaks (full history, values redacted)
        continue-on-error: true
        run: |
          curl -fsSL -o gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner
      - name: trivy config (Dockerfiles, compose, workflows)
        continue-on-error: true
        run: |
          curl -fsSL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar xzf trivy.tgz trivy
          ./trivy config --severity HIGH,CRITICAL --quiet .
