name: Test CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:18000/api/v1
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:route && npm run test:question && npm run test:placement && npm run test:bubble
      - run: npx expo export --platform web
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Age gate in normal and reduced motion
        run: |
          python3 -m http.server 18081 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:18081/ >/dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" MENTO_WEB=http://127.0.0.1:18081 node e2e/age-gate.e2e.js
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release policy tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate worker startup rollback control flow
        run: bash deploy/test-worker-rollback.sh
      - name: Validate backup failure handling
        run: bash deploy/test-backup-failures.sh
      - name: Validate encrypted backup round trip
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          bash deploy/test-backup-encryption.sh
      - name: Restore an encrypted synthetic database
        run: |
          docker build -t mento-backup-drill services/api
          RESTORE_IMAGE=mento-backup-drill bash deploy/test-encrypted-database-restore.sh
      - name: Validate all GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck=
      - name: Validate shell syntax
        run: while IFS= read -r -d '' file; do bash -n "$file"; done < <(find deploy scripts/ci -name '*.sh' -print0)
  receiver-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build disposable SSH test environment
        run: docker build -f deploy/production-installer-test.Dockerfile -t mento-installer-test deploy
      - name: Verify installer and restricted identity over real SSH
        run: docker run --rm --network none --mount "type=bind,source=$PWD,target=/work,readonly" mento-installer-test /work/deploy/test-production-installer.sh
  test-gate:
    if: always()
    needs: [mobile-web, release-tooling, receiver-isolation]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(v["result"] == "success" for v in json.loads(os.environ["RESULTS"]).values()), "A required test job did not pass"'
