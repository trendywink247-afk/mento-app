name: Test CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: http://127.0.0.1:18000/api/v1
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Verify native release configuration separation
        run: node e2e/release-config.test.cjs
      - run: node e2e/keyboard-boundary.test.cjs
      - name: Verify inactive own-chat protocol client
        run: node --test e2e/own-chat-client.test.cjs
      - run: npm run test:route && npm run test:question && npm run test:placement && npm run test:bubble
      - run: npx expo export --platform web
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-package-lock playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Age gate in normal and reduced motion
        run: |
          python3 -m http.server 18081 --bind 127.0.0.1 --directory dist > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:18081/ >/dev/null && break; sleep 1; done
          NODE_PATH="$RUNNER_TEMP/browser-tools/node_modules" MENTO_WEB=http://127.0.0.1:18081 node e2e/age-gate.e2e.js
  release-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate release policy tests
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
      - name: Validate Balanced Compose parity and database overlap budget
        run: bash deploy/test-parity.sh
      - name: Validate worker startup rollback control flow
        run: bash deploy/test-worker-rollback.sh
      - name: Validate backup failure handling
        run: bash deploy/test-backup-failures.sh
      - name: Validate monitor alert retries without network
        run: bash deploy/test-monitor-alert-retry.sh
      - name: Validate encrypted backup round trip
        run: |
          sudo apt-get update -qq
            sudo apt-get install -y -qq age rclone
          bash deploy/test-backup-encryption.sh
      - name: Restore an encrypted synthetic database
        run: |
          docker build -t mento-backup-drill services/api
          RESTORE_IMAGE=mento-backup-drill bash deploy/test-encrypted-database-restore.sh
          BASELINE_REVISION=c13a0seen001 RESTORE_IMAGE=mento-backup-drill bash deploy/test-encrypted-database-restore.sh
      - name: Validate snapshot locks against concurrent partition DDL
        run: bash deploy/test-snapshot-ddl.sh
      - name: Validate isolated erasure receipt export
        run: bash deploy/test-erasure-receipt-export.sh
      - name: Validate all GitHub workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck=
      - name: Validate shell syntax
        run: while IFS= read -r -d '' file; do bash -n "$file"; done < <(find deploy scripts/ci -name '*.sh' -print0)
  recovery-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/recovery_receiver/requirements*.txt
      - run: python -m pip install -r services/recovery_receiver/requirements-dev.txt
      - run: python -m ruff check services/recovery_receiver
      - run: python -m ruff format --check services/recovery_receiver
      - name: Verify independent receipt durability and request contract
        run: python -m pytest -c services/recovery_receiver/pyproject.toml services/recovery_receiver/tests -q
  receiver-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build disposable SSH test environment
        run: docker build -f deploy/production-installer-test.Dockerfile -t mento-installer-test deploy
      - name: Verify installer and restricted identity over real SSH
        run: docker run --rm --network none --mount "type=bind,source=$PWD,target=/work,readonly" mento-installer-test /work/deploy/test-production-installer.sh
  test-gate:
    if: always()
    needs: [mobile-web, release-tooling, receiver-isolation, recovery-receipts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 -c 'import json,os; assert all(v["result"] == "success" for v in json.loads(os.environ["RESULTS"]).values()), "A required test job did not pass"'
