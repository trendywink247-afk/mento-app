name: SonarQube

# Secondary path. The self-hosted server listens on 127.0.0.1 of the QA box, which GitHub's
# runners cannot reach, so the primary scan is box-local: ops/sonar-scan.sh (docs/SONARQUBE.md).
# This workflow runs only when a reachable server is configured: repository secret SONAR_TOKEN
# and repository variable SONAR_HOST_URL (a tunnelled/public SonarQube, or SonarQube Cloud).
# Without both it records a skip and passes. Non-blocking: no quality-gate wait.

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
    steps:
      - name: Check configuration
        id: cfg
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SonarQube not configured for Actions (SONAR_TOKEN secret / SONAR_HOST_URL variable); skipped. Box-local scans use ops/sonar-scan.sh."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          fetch-depth: 0 # blame data for new-code detection
      - name: Scan
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          docker run --rm -u "$(id -u):$(id -g)" \
            -e SONAR_HOST_URL -e SONAR_TOKEN \
            -v "$GITHUB_WORKSPACE:/usr/src" \
            sonarsource/sonar-scanner-cli:12.2.0.4256_8.1.0 \
            -Dsonar.projectVersion="${GITHUB_SHA::12}" \
            -Dsonar.scm.revision="$GITHUB_SHA"
