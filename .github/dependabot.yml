version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Expo/native majors must follow the staged compatibility plan.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
      # Native runtime upgrades are coordinated with Expo and each other.
      # For 0.x packages, incompatible upgrades can be semver-minor.
      - dependency-name: react-native
        update-types: ['version-update:semver-minor']
      - dependency-name: react-native-reanimated
        update-types: ['version-update:semver-minor']
      - dependency-name: react-native-worklets
        update-types: ['version-update:semver-minor']
      - dependency-name: react
        update-types: ['version-update:semver-minor']
      - dependency-name: react-dom
        update-types: ['version-update:semver-minor']
      - dependency-name: '@types/react'
        update-types: ['version-update:semver-minor']
  - package-ecosystem: pip
    directories:
      - /services/api
      - /services/recovery_receiver
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
